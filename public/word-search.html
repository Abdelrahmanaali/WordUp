<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordUp — Word Search</title><link rel="stylesheet" href="/word-search.css"></head><body><header><a href="/" class="brand">W<span>WordUp</span></a><a href="/" class="back">← WordUp</a></header><main><section id="lobby" class="screen"><div class="eyebrow">WORD SEARCH · WITH FRIENDS</div><h1>Find words.<br><em>Beat your friends.</em></h1><p class="sub">Create a room, share the code, and race through the same puzzle in real time.</p><div class="panel"><label>Nickname<input id="name" maxlength="18" placeholder="Your nickname"></label><div class="actions"><button id="create" class="primary">Create Game →</button><button id="join" class="secondary">Join with Code ↗</button></div><div id="joinBox" class="hidden"><label>Room code<input id="code" maxlength="6" placeholder="ABC123"></label><button id="joinRoom" class="primary full">Join Room</button></div></div></section><section id="room" class="screen hidden"><div class="roomHead"><div><div class="eyebrow">ROOM CODE</div><h2 id="roomCode">------</h2></div><button id="copy" class="secondary">Copy invite link</button></div><div class="panel"><div id="players"></div><button id="ready" class="primary full">I'm Ready ✓</button><p class="hint">Both players must be ready.</p></div></section><section id="game" class="screen hidden"><div class="gameHead"><div><div class="eyebrow">WORD SEARCH</div><h2 id="category">Classic</h2></div><div id="timer" class="timer">02:00</div></div><div class="gameGrid"><div class="panel boardWrap"><div id="grid" class="grid"></div></div><aside class="panel words"><div class="eyebrow">WORDS</div><div id="wordList"></div></aside></div><div id="score" class="score"></div></section><section id="finish" class="screen hidden"><div class="panel finish"><div class="eyebrow">MATCH COMPLETE</div><h1 id="winner"></h1><p id="finishText"></p><button class="primary" onclick="location.reload()">Play Again →</button></div></section></main><div id="toast"></div><script src="/word-search.js"></script></body></html>
